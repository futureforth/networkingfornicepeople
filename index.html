  :root{
    --bg:#f2f0eb;
    --surface:#ffffff;
    --surface-2:#f0eee8;
    --surface-3:#e8e5dd;
    --text:#000000;
    --text-muted:#6f7279;
    --text-faint:#9a9da3;
    --accent:#f7941d;
    --accent-ink:#000000;
    --stamp:#00add8;
    --stamp-ink:#00222b;
    --lime:#b6bd00;
    --danger:#d60057;
    --hairline:rgba(0,0,0,0.16);
    --hairline-strong:#000000;
    --avatar-1:#f7941d;
    --avatar-2:#00add8;
    --avatar-3:#6f7279;
    --avatar-4:#d60057;
    --avatar-5:#5e0d8b;
    --avatar-6:#26cad3;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Fengardo Neue',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0;
    margin:0;
  }
  body{padding-inline:0;}

  .display{font-family:'Fengardo Neue Black',system-ui,sans-serif; font-weight:900; letter-spacing:0.005em;}
  .script{font-family:'Bello Pro',cursive; font-weight:400;}
  .mono{font-family:'Fengardo Neue',ui-monospace,monospace;}
  .eyebrow{font-family:'Fengardo Neue',ui-monospace,monospace; text-transform:uppercase; letter-spacing:0.12em; font-size:11px; font-weight:400;}

  #shell{
    max-width:460px;
    margin:0 auto;
    min-height:100dvh;
    position:relative;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(247,148,29,0.10), transparent 60%),
      var(--bg);
  }
  @media (min-width:461px){
    #shell{
      box-shadow:0 0 0 1px var(--hairline), 0 40px 80px -20px rgba(0,0,0,0.6);
      min-height:100vh;
    }
  }

  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    gap:12px;
  }
  .wordmark{
    display:flex; align-items:baseline; gap:8px;
  }
  .wordmark .display{font-size:22px; color:var(--text); line-height:1;}
  .wordmark .tag{font-size:10px; color:var(--accent-ink); background:var(--accent); padding:3px 8px; border-radius:999px; letter-spacing:0.08em;}
  .wordmark-mascot{width:30px; height:30px; object-fit:contain; flex-shrink:0;}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface); border:2px solid var(--hairline-strong);
    color:var(--text);
    cursor:pointer;
  }
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  main{
    flex:1;
    padding:4px 20px 100px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  /* ---- Buttons & form controls ---- */
  .btn{
    font-family:'Fengardo Neue Black',sans-serif;
    font-weight:900; font-size:15px;
    border-radius:14px;
    padding:13px 18px;
    border:2px solid var(--hairline-strong);
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    line-height:1.2; text-decoration:none;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--hairline-strong);}
  .btn-primary:hover{filter:brightness(1.04);}
  .btn-ghost{background:var(--surface); color:var(--text);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-text{background:none; border:none; color:var(--accent-ink); text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:3px; font-weight:900; font-size:14px; cursor:pointer; padding:6px 0; font-family:'Fengardo Neue Black',sans-serif;}
  .btn-danger{background:var(--surface); color:var(--danger); border-color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px; font-size:13px; border-radius:10px; border-width:2px;}

  label.field{display:flex; flex-direction:column; gap:7px;}
  label.field .flabel{font-size:12.5px; font-weight:600; color:var(--text-muted);}
  input[type=text], input[type=email], input[type=tel], input[type=url], textarea{
    background:var(--surface-2);
    border:1px solid var(--hairline);
    color:var(--text);
    border-radius:10px;
    padding:12px 13px;
    font-family:'Fengardo Neue',sans-serif;
    font-size:15px;
    width:100%;
  }
  input::placeholder, textarea::placeholder{color:var(--text-faint);}
  textarea{resize:vertical; min-height:76px; font-family:'Fengardo Neue',sans-serif;}

  .chiprow{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-size:13px; font-weight:600;
    padding:8px 13px; border-radius:999px;
    border:1px solid var(--hairline-strong);
    background:var(--surface-2); color:var(--text-muted);
    cursor:pointer;
  }
  .chip.selected{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .chip.tag{background:var(--surface-3); color:var(--text); cursor:default; border-color:transparent;}
  .chip.tag.remove{cursor:pointer;}
  .chip.tag .x{margin-left:6px; opacity:0.6;}
  .chip.tag.stamp-tag{background:rgba(0,173,216,0.16); color:var(--stamp-ink); border:1px solid rgba(0,173,216,0.4);}

  .taginput{display:flex; gap:8px;}
  .taginput input{flex:1;}

  /* ---- Intro ---- */
  .intro-hero{
    padding-top:6px;
  }
  .intro-hero .display{font-size:40px; line-height:0.98; color:var(--text);}
  .intro-hero p{color:var(--text-muted); font-size:15px; line-height:1.55; max-width:34ch; margin-top:10px;}
  .intro-list{display:flex; flex-direction:column; gap:14px; margin-top:6px;}
  .intro-row{display:flex; gap:12px; align-items:flex-start;}
  .intro-num{
    font-family:'Fengardo Neue',monospace; font-weight:600; font-size:13px;
    color:var(--accent-ink); background:var(--accent);
    width:24px; height:24px; border-radius:7px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
  }
  .intro-row div p{margin:0; color:var(--text); font-size:14.5px; font-weight:600;}
  .intro-row div span{color:var(--text-muted); font-size:13.5px;}

  /* ---- Badge card ---- */
  .badge-card{
    background:var(--surface);
    border:2.5px solid var(--hairline-strong);
    border-radius:26px;
    padding:26px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .badge-card::before{
    content:"";
    position:absolute; top:0; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%;
    background:var(--bg);
    box-shadow:0 0 0 2.5px var(--hairline-strong);
  }
  .badge-punch{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:36px; height:36px; border-radius:50%;
    background:var(--bg); box-shadow:inset 0 0 0 2px var(--hairline-strong);
  }
  .badge-head{display:flex; align-items:center; gap:14px; margin-top:6px;}
  .avatar{
    width:56px; height:56px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fengardo Neue Black',sans-serif; font-weight:900; font-size:22px;
    color:#fff; flex-shrink:0; border:2px solid var(--hairline-strong);
    background-size:cover; background-position:center;
  }
  .badge-name{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .badge-name .display{font-size:26px; color:var(--text); line-height:1.05; text-wrap:balance;}
  .badge-name .headline{font-size:13.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .badge-goal{
    margin-top:14px; display:inline-flex; align-self:flex-start;
    font-size:12px; font-weight:900; color:var(--stamp-ink);
    background:rgba(0,173,216,0.16); border:2px solid var(--stamp);
    padding:6px 12px; border-radius:999px;
  }
  .badge-divider{
    margin:18px 0; border:none; border-top:2px dashed var(--hairline-strong); opacity:0.35;
  }
  .badge-tags-label{font-size:11px; color:var(--text-faint); margin-bottom:8px;}
  .badge-section + .badge-section{margin-top:16px;}

  .qr-wrap{
    margin-top:20px;
    background:#ffffff;
    border-radius:16px;
    padding:16px;
    display:flex; align-items:center; justify-content:center;
    border:2.5px solid var(--hairline-strong);
  }
  .qr-wrap #qrcode{line-height:0;}
  .qr-wrap #qrcode img, .qr-wrap #qrcode canvas{border-radius:4px; display:block;}
  .qr-caption{text-align:center; color:var(--text-faint); font-size:12px; margin-top:10px;}

  .badge-actions{display:flex; gap:10px; margin-top:18px;}
  .badge-actions .btn{flex:1; min-width:0;}

  /* ---- Scan ---- */
  .scan-frame{
    position:relative; border-radius:18px; overflow:hidden;
    background:#000; aspect-ratio:3/4; width:100%;
    border:2.5px solid var(--hairline-strong);
  }
  .scan-frame video{width:100%; height:100%; object-fit:cover; display:block;}
  .scan-reticle{
    position:absolute; inset:14% 14%; border-radius:16px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.35);
    outline:2px solid var(--accent); outline-offset:-2px;
  }
  .scan-corner{position:absolute; width:22px; height:22px; border-color:var(--accent);}

    padding:14px 14px 12px;
  }
  .stat .n{font-family:'Fengardo Neue Black',sans-serif; font-weight:800; font-size:28px; color:var(--text); line-height:1;}
  .stat .l{font-size:11.5px; color:var(--text-muted); margin-top:4px;}

  .due-banner{
    background:rgba(0,173,216,0.12); border:2px solid rgba(0,173,216,0.4);
    border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
    font-size:13.5px; color:var(--text);
  }
  .due-banner strong{color:var(--stamp-ink);}

  .conn-list{display:flex; flex-direction:column; gap:12px;}
  .conn-card{
    background:var(--surface); border:2px solid var(--hairline-strong); border-radius:16px;

  }

  .conn-info{flex:1; min-width:0;}
  .conn-info .name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  .conn-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .contact-row{display:flex; gap:8px; margin-top:12px;}

  }
  .contact-icon:hover{color:var(--text); border-color:var(--hairline-strong);}
  .kebab{background:none; border:none; color:var(--text-faint); cursor:pointer; padding:4px; flex-shrink:0;}

    font-size:12px; font-weight:600; color:var(--stamp);
  }
  .note-block{margin-top:12px;}
  .note-text{
    background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:13.5px; color:var(--text);

  .locked-note{font-size:12px; color:var(--text-faint); margin-top:10px;}

  /* ---------------- state ---------------- */
  var state = {
    me: loadMe(),
    connections: loadConns(),
    tab: "badge",
    editing: false,
    scanning: false,
    pending: null,        // decoded profile awaiting confirmation
    quickCaptureExpanded: false, // true once a pending visitor chooses "make my badge now"
    justConnected: null,  // profile just added, for overlay
    settingsOpen: false,
    resetArmed: false,
    noteDraft: {},         // connId -> draft text while composing
    composingNote: null,   // connId currently open for note entry
    deleteArmed: null      // connId armed for delete confirm
  };

  // seed sample connections once, only after a real profile exists and list is empty
  function maybeSeed(){
    if(!state.me) return;
    if(localStorage.getItem(LS_SEEDED)) return;
    if(state.connections.length) { localStorage.setItem(LS_SEEDED,"1"); return; }
    var now = Date.now();
    state.connections = [
      {
        profile:{ id:uid("smp"), name:"Priya Nakamura", headline:"Partnerships, Meridian Health",
          goal:"Selling a service", profTags:["Health tech","Partnerships"], persTags:["Trail running"],
          contact:{ email:"priya@example.com", phone:"", linkedin:"https://linkedin.com/in/example", other:"" } },
        connectedAt: now - 7*3600000, notes:"", noteAddedAt:null, sample:true
      },
      {
        profile:{ id:uid("smp"), name:"Marcus Webb", headline:"Founder, Loop Studio",
          goal:"Hiring", profTags:["Product design","Startups"], persTags:["Vinyl records"],
          contact:{ email:"", phone:"", linkedin:"", other:"marcuswebb.com" } },
        connectedAt: now - 40*60000, notes:"", noteAddedAt:null, sample:true
      }
    ];
    saveConns(state.connections);
    localStorage.setItem(LS_SEEDED,"1");
  }

  /* ---------------- render root ---------------- */
  var app = document.getElementById("app");

  function render(){
    stopScanIfRunning();
    var html = "";

    if(!state.me){
      html = (state.pending && !state.quickCaptureExpanded) ? renderQuickCapture() : renderOnboarding();
    } else if(state.editing){
      html = renderOnboarding(true);
    } else {
      html += renderTopbar();
      html += '<main>' + renderTab() + renderFooter() + '</main>';
      html += renderTabbar();
    }

    if(state.justConnected){ html += renderConnectedOverlay(); }
    if(state.settingsOpen){ html += renderSettingsSheet(); }

    app.innerHTML = html;
    wireUp();
  }

  function renderTopbar(){
    return '' +
    '<header class="topbar">' +
      '<div class="wordmark"><img src="'+MASCOT_ICON+'" alt="" class="wordmark-mascot"/><span class="display">NICE PEOPLE</span></div>' +
      '<button class="icon-btn" id="btnSettings" aria-label="Settings">'+ICONS.gear+'</button>' +
    '</header>';
  }

  function renderFooter(){
    return '<p class="app-footer">© 2026 Networking For Nice People made with love by ' +
      '<a href="https://davedelaney.me/" target="_blank" rel="noopener">Dave Delaney</a> in Nashville.</p>';
  }

  function renderTabbar(){
    var dueCount = state.connections.filter(isDue).length;
    function tab(id, icon, label){
      var active = state.tab===id ? " active" : "";
      var dot = (id==="conns" && dueCount>0) ? '<span class="dot"></span>' : "";
      return '<button class="tab'+active+'" data-tab="'+id+'" style="position:relative">'+dot+icon+'<span class="tlabel">'+label+'</span></button>';
    }
    return '<nav class="tabbar"><div class="tabbar-inner">' +
      tab("badge", ICONS.badge, "Badge") +
      tab("scan", ICONS.scan, "Scan") +
      tab("conns", ICONS.conns, "Connections") +
    '</div></nav>';
  }

  function renderTab(){
    if(state.tab==="scan") return renderScan();
    if(state.tab==="conns") return renderConnections();
    return renderBadge();
  }

  /* ---------------- quick capture (scanned someone but have no badge yet) ---------------- */
  function reminderBody(p, link){
    var interests = (p.profTags||[]).concat(p.persTags||[]);
    var lines = [
      "Hey — it's you, with a quick reminder.",
      "",
      "You met " + p.name + (p.headline? " (" + p.headline + ")" : "") + " and traded NicePeople badges, but didn’t finish making your own yet.",
      interests.length ? "They’re into: " + interests.join(", ") : null,
      "",
      "Tap this link when you have a minute — it’ll create your badge and lock in the connection with them:",
      link,
      "",
      "— NicePeople (skip the feed)"
    ].filter(function(x){ return x !== null; });
    return lines.join("\n");
  }
  function mailtoHref(p, link){
    var subject = "You met " + p.name + " — finish your NicePeople badge";
    return "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(reminderBody(p, link));
  }
  function legacyCopy(text, cb){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      if(cb) cb();
    }catch(e){}
  }

  function renderQuickCapture(){
    var p = state.pending;
    var link = connectUrl(p);
    var interests = (p.profTags||[]).concat(p.persTags||[]);
    return '' +
    '<div style="padding:28px 20px 60px; display:flex; flex-direction:column; gap:18px;">' +
      '<div class="wordmark" style="justify-content:center; margin-bottom:2px"><span class="display" style="font-size:20px">NICE PEOPLE</span></div>' +
      '<div class="stamp-seal" style="margin:4px auto 0;">'+ICONS.mail+'</div>' +
      '<div style="text-align:center">' +
        '<div class="display" style="font-size:24px; text-wrap:balance;">YOU JUST MET</div>' +
        '<div class="display" style="font-size:22px; color:var(--accent); margin-top:2px;">'+escapeHtml(p.name)+'</div>' +
        (p.headline? '<div style="color:var(--text-muted); font-size:14px; margin-top:4px;">'+escapeHtml(p.headline)+'</div>' : '') +
        (interests.length? '<div class="chiprow" style="justify-content:center; margin-top:12px;">'+interests.slice(0,5).map(function(t){return '<span class="chip tag">'+escapeHtml(t)+'</span>';}).join("")+'</div>' : '') +
      '</div>' +
      '<p style="color:var(--text-muted); font-size:14.5px; text-align:center; line-height:1.55; margin:0;">No time to make your own badge right now? Fair — email yourself this link and finish it later. It’ll remember exactly who you met.</p>' +
      '<a class="btn btn-primary btn-block" id="btnEmailReminder" href="'+attr(mailtoHref(p, link))+'">'+ICONS.mail+' Email myself a reminder</a>' +
      '<div style="background:var(--surface-2); border:1px solid var(--hairline); border-radius:12px; padding:13px; display:flex; flex-direction:column; gap:9px;">' +
        '<div class="mono" style="font-size:11px; color:var(--text-faint); word-break:break-all; line-height:1.5;">'+escapeHtml(link)+'</div>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="btnCopyLink">Copy link instead</button>' +
        '<span id="copyStatus" class="mono" style="font-size:11.5px; color:var(--stamp); display:none;">Copied — paste it in Notes or a text to yourself.</span>' +
      '</div>' +
      '<button type="button" class="btn btn-text" id="btnFullOnboard" style="align-self:center">Or make your badge now (2 min) →</button>' +
    '</div>';
  }

  /* ---------------- onboarding ---------------- */
  function renderOnboarding(isEdit){

  /* ---------------- utils ---------------- */
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function attr(s){ return escapeHtml(s); }
  function normalizeUrl(u){ if(!/^https?:\/\//i.test(u)) return "https://"+u; return u; }

  /* ---------------- downloads capability ---------------- */
  var downloadsPromise = null;
  function getDownloads(){
    if(downloadsPromise) return downloadsPromise;
    if(window.claude && typeof window.claude.use === "function"){
      downloadsPromise = window.claude.use("downloads").catch(function(){ return null; });
    } else {
      downloadsPromise = Promise.resolve(null);
    }
    return downloadsPromise;
  }
  function slugify(s){ return String(s||"nicepeople").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "nicepeople"; }

  function setStatus(id, msg, isError){
    var el = document.getElementById(id);
    if(!el) return;
    el.textContent = msg;
    el.style.color = isError ? "var(--danger)" : "var(--stamp)";
  }

  /* ---------------- badge PNG export ---------------- */
  function loadImage(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }
  function fontsReady(){
    if(document.fonts && document.fonts.ready){ return document.fonts.ready.catch(function(){}); }
    return Promise.resolve();
  }
  function wrapText(ctx, text, maxWidth){
    var words = String(text||"").split(/\s+/).filter(Boolean);
    var lines = [], cur = "";
    words.forEach(function(w){
      var test = cur ? cur+" "+w : w;
      if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
      else { cur = test; }
    });
    if(cur) lines.push(cur);
    return lines;
  }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function renderBadgePng(p){
    return fontsReady().then(function(){
      var W = 1000, H = 1360, scale = 1;
      var canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext("2d");

      var bg = "#f2f0eb", surface = "#ffffff", hairline = "#000000";
      var text = "#000000", muted = "#6f7279", accent = "#f7941d";

      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

      var pad = 56;
      roundRect(ctx, pad, pad, W-pad*2, H-pad*2, 40);
      ctx.fillStyle = surface; ctx.fill();
      ctx.strokeStyle = hairline; ctx.lineWidth = 5; ctx.stroke();

      // wordmark
      ctx.fillStyle = text;
      ctx.font = "900 28px 'Fengardo Neue Black', sans-serif";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("NICEPEOPLE · SKIP THE FEED", pad+56, pad+90);

      // avatar
      var cx = pad+56+44, cy = pad+180, r = 44;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = avatarHexForName(p.name);
      ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = hairline; ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 34px 'Fengardo Neue Black', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(initials(p.name), cx, cy+2);
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

      // name + headline
      ctx.fillStyle = text;
      ctx.font = "900 54px 'Fengardo Neue Black', sans-serif";
      ctx.fillText(p.name, pad+56+108, pad+170);
      if(p.headline){
        ctx.fillStyle = muted;
        ctx.font = "500 26px 'Fengardo Neue', sans-serif";
        ctx.fillText(p.headline, pad+56+108, pad+206);
      }

      var y = pad+270;
      if(p.goal){
        ctx.font = "700 24px 'Fengardo Neue', sans-serif";
        var tw = ctx.measureText(p.goal).width;
        roundRect(ctx, pad+56, y-34, tw+36, 50, 25);
        ctx.fillStyle = "rgba(0,173,216,0.16)"; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = "#00add8"; ctx.stroke();
        ctx.fillStyle = "#00222b";
        ctx.fillText(p.goal, pad+56+18, y);
        y += 60;
      }

      // tags
      var tags = (p.profTags||[]).concat(p.persTags||[]).slice(0,6);
      if(tags.length){
        ctx.font = "600 22px 'Fengardo Neue', sans-serif";
        var tx = pad+56;
        tags.forEach(function(t){
          var w = ctx.measureText(t).width + 32;
          if(tx + w > W-pad-56){ tx = pad+56; y += 56; }
          roundRect(ctx, tx, y-30, w, 46, 23);
          ctx.fillStyle = "#e8e5dd"; ctx.fill();
          ctx.fillStyle = text;
          ctx.fillText(t, tx+16, y);
          tx += w + 12;
        });
        y += 70;
      }

      // qr code
      var qrEl = document.getElementById("qrcode");
      var qrSource = qrEl ? (qrEl.querySelector("canvas") || qrEl.querySelector("img")) : null;
      var qrSize = 560;
      var qx = (W - qrSize)/2, qy = H - pad - qrSize - 70;
      roundRect(ctx, qx-24, qy-24, qrSize+48, qrSize+48, 24);
      ctx.fillStyle = "#ffffff"; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = hairline; ctx.stroke();
      if(qrSource){
        try{ ctx.drawImage(qrSource, qx, qy, qrSize, qrSize); }catch(e){}
      }
      ctx.fillStyle = muted;
      ctx.font = "500 22px 'Fengardo Neue', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Scan to connect — nicepeople", W/2, qy+qrSize+56);
      ctx.textAlign = "left";

      return new Promise(function(resolve){
        canvas.toBlob(function(blob){ resolve(blob); }, "image/png");
      });
    });
  }
  function avatarHexForName(name){
    var hexes = ["#f7941d","#00add8","#6f7279","#d60057","#5e0d8b","#26cad3"];
    var h = 0;
    for(var i=0;i<(name||"").length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    return hexes[h % hexes.length];
  }

  /* Works two ways: the claude.ai `downloads` capability when this page runs as a
     Claude artifact, or a plain browser download (blob URL + synthetic click) when
     it's self-hosted on its own domain. Same file, either home. */
  function browserDownload(filename, data){
    try{
      var blob = (data instanceof Blob) ? data : new Blob([data], { type:"text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    }catch(e){ return false; }
  }

  function saveBadgeImage(){
    setStatus("saveBadgeStatus","Preparing your badge…", false);
    renderBadgePng(state.me).then(function(blob){
      if(!blob){ setStatus("saveBadgeStatus","Couldn’t generate the image.", true); return; }
      var filename = "nicepeople-badge-"+slugify(state.me.name)+".png";
      getDownloads().then(function(downloads){
        if(downloads){
          downloads.save({ filename:filename, data:blob }).then(function(){
            setStatus("saveBadgeStatus","Saved.", false);
          }).catch(function(err){
            if(err && err.code === "declined"){ setStatus("saveBadgeStatus","",false); return; }
            setStatus("saveBadgeStatus","Couldn’t save that — try again.", true);
          });
        } else {
          var ok = browserDownload(filename, blob);
          setStatus("saveBadgeStatus", ok ? "Saved." : "Couldn’t save that — try again.", !ok);
        }
      });
    }).catch(function(){
      setStatus("saveBadgeStatus","Couldn’t generate the image.", true);
    });
  }

  /* ---------------- connections CSV export ---------------- */
  function csvEscape(v){
    v = String(v==null?"":v);
    if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }
  function buildConnectionsCsv(){
    var header = ["Name","Headline","Goal","Professional interests","Personal interests","Email","Phone","LinkedIn","Other link","Met at","Note"];
    var rows = state.connections.slice().sort(function(a,b){ return b.connectedAt - a.connectedAt; }).map(function(c){
      var p = c.profile;
      return [
        p.name, p.headline, p.goal,
        (p.profTags||[]).join("; "), (p.persTags||[]).join("; "),
        p.contact&&p.contact.email, p.contact&&p.contact.phone, p.contact&&p.contact.linkedin, p.contact&&p.contact.other,
        new Date(c.connectedAt).toLocaleString(), c.notes
      ].map(csvEscape).join(",");
    });
    return header.map(csvEscape).join(",") + "\n" + rows.join("\n") + "\n";
  }
  function exportConnections(){
    setStatus("exportStatus","Preparing your export…", false);
    var csv = buildConnectionsCsv();
    var filename = "nicepeople-connections.csv";
    getDownloads().then(function(downloads){
      if(downloads){
        downloads.save({ filename:filename, data:csv }).then(function(){
          setStatus("exportStatus","Saved.", false);
        }).catch(function(err){
          if(err && err.code === "declined"){ setStatus("exportStatus","",false); return; }
          setStatus("exportStatus","Couldn’t export that — try again.", true);
        });
      } else {
        var ok = browserDownload(filename, csv);
        setStatus("exportStatus", ok ? "Saved." : "Couldn’t export that — try again.", !ok);
      }
    });
  }

  /* ---------------- QR generation ---------------- */
  var qrInstance = null;
  function paintQr(){
    var el = document.getElementById("qrcode");
    if(!el || !state.me || typeof QRCode === "undefined") return;
    var url = connectUrl(state.me);
    try{
      el.innerHTML = "";
      qrInstance = new QRCode(el, { text:url, width:196, height:196, colorDark:"#14171b", colorLight:"#f3efe6", correctLevel: QRCode.CorrectLevel.M });
    }catch(e){ el.textContent = "QR unavailable"; }
  }

  /* ---------------- scanning ---------------- */
  var scanStream = null, scanRAF = null;
  function startScan(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      flashScanStatus("This browser can’t open the camera here — use your phone’s regular camera app, or paste a badge link below.");
      return;
    }
    state.scanning = true; render();
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(function(stream){
      scanStream = stream;
      var video = document.getElementById("scanVideo");
      if(!video){ stopScanIfRunning(); return; }
      video.srcObject = stream;
      video.setAttribute("playsinline","true");
      video.play().catch(function(){});
      var canvas = document.createElement("canvas");
      var ctx = canvas.getContext("2d");
      function tick(){
        if(!state.scanning) return;
        if(video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR !== "undefined"){
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          var img = ctx.getImageData(0,0,canvas.width,canvas.height);
          var code = jsQR(img.data, img.width, img.height);
          if(code && code.data){ handleScannedText(code.data); return; }
        }
        scanRAF = requestAnimationFrame(tick);
      }
      scanRAF = requestAnimationFrame(tick);
    }).catch(function(){
      state.scanning = false;
      var s = document.getElementById("scanStatus");
      if(s) s.textContent = "Couldn’t access the camera — paste a badge link below instead.";
      render();
    });
  }
  function stopScanIfRunning(){
    if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
    if(scanStream){ scanStream.getTracks().forEach(function(t){ t.stop(); }); scanStream = null; }
  }

  function handleScannedText(text){
    state.scanning = false;
    stopScanIfRunning();
    var cParam = null;
    try{
      var u = new URL(text);
      cParam = u.searchParams.get("c");
    }catch(e){
      var m = text.match(/[?&]c=([^&]+)/);
      cParam = m ? m[1] : text;
    }
    if(!cParam){ flashScanStatus("That doesn’t look like a NicePeople badge."); return; }
    processConnectPayload(cParam);
  }
  function flashScanStatus(msg){
    render();
    var s = document.getElementById("scanStatus");
    if(s) s.textContent = msg;
  }

  /* ---------------- connect flow ---------------- */
  function processConnectPayload(cParam){
    var profile = decodeProfile(cParam);
    if(!profile){ flashScanStatus("That badge link looks damaged."); return; }
    if(state.me && profile.id === state.me.id){ flashScanStatus("That’s your own badge!"); return; }

    if(!state.me){
      state.pending = profile;
      render();
      return;
    }

    var existing = state.connections.find(function(c){ return c.profile.id === profile.id; });
    if(existing){
      existing.profile = profile; // refresh their latest info
      saveConns(state.connections);
      state.justConnected = profile;
      state.tab = "conns";
      render();
      return;
    }

    state.connections.push({ profile:profile, connectedAt: Date.now(), notes:"", noteAddedAt:null });
    saveConns(state.connections);
    state.justConnected = profile;
    state.tab = "conns";
    render();
  }

  /* ---------------- event wiring ---------------- */
  function wireUp(){
    ensureConnIds();

    if(state.tab==="badge" && state.me && !state.editing) paintQr();

    var btnSettings = document.getElementById("btnSettings");
    if(btnSettings) btnSettings.onclick = function(){ state.settingsOpen = true; render(); };

    var sheetBackdrop = document.getElementById("sheetBackdrop");
    if(sheetBackdrop) sheetBackdrop.onclick = function(e){ if(e.target===sheetBackdrop){ state.settingsOpen=false; state.resetArmed=false; render(); } };
    var btnCloseSheet = document.getElementById("btnCloseSheet");
    if(btnCloseSheet) btnCloseSheet.onclick = function(){ state.settingsOpen=false; state.resetArmed=false; render(); };
    var btnResetStart = document.getElementById("btnResetStart");
    if(btnResetStart) btnResetStart.onclick = function(){ state.resetArmed = true; render(); };
    var btnResetCancel = document.getElementById("btnResetCancel");
    if(btnResetCancel) btnResetCancel.onclick = function(){ state.resetArmed = false; render(); };
    var btnResetConfirm = document.getElementById("btnResetConfirm");
    if(btnResetConfirm) btnResetConfirm.onclick = function(){
      try{ localStorage.removeItem(LS_ME); localStorage.removeItem(LS_CONN); localStorage.removeItem(LS_SEEDED); }catch(e){}
      state.me=null; state.connections=[]; state.settingsOpen=false; state.resetArmed=false; state.tab="badge";
      render();
    };

    document.querySelectorAll(".tab").forEach(function(t){
      t.onclick = function(){ state.tab = t.getAttribute("data-tab"); render(); };
    });

    var btnEdit = document.getElementById("btnEdit");
    if(btnEdit) btnEdit.onclick = function(){ state.editing = true; render(); };
    var btnSaveBadge = document.getElementById("btnSaveBadge");
    if(btnSaveBadge) btnSaveBadge.onclick = saveBadgeImage;
    var btnExportConns = document.getElementById("btnExportConns");
    if(btnExportConns) btnExportConns.onclick = exportConnections;
    var btnCancelEdit = document.getElementById("btnCancelEdit");
    if(btnCancelEdit) btnCancelEdit.onclick = function(){ state.editing = false; render(); };

    var form = document.getElementById("profileForm");
    if(form) form.onsubmit = function(e){ e.preventDefault(); submitProfileForm(); };

    document.querySelectorAll("#goalChips .chip").forEach(function(ch){
      ch.onclick = function(){
        var g = ch.getAttribute("data-goal");
        var cur = ch.classList.contains("selected");
        document.querySelectorAll("#goalChips .chip").forEach(function(x){ x.classList.remove("selected"); });
        if(!cur){ ch.classList.add("selected"); document.getElementById("fGoalOther").value=""; }
      };
    });

    ["profTags","persTags"].forEach(function(key){
      var btn = document.querySelector('[data-addtag="'+key+'"]');
      var input = document.getElementById("input_"+key);
      if(btn && input){
        function add(){
          var v = input.value.trim().replace(/,$/,"");
          if(v){ addTagToForm(key, v); }
          input.value="";
        }
        btn.onclick = add;
        input.onkeydown = function(e){ if(e.key==="Enter" || e.key===","){ e.preventDefault(); add(); } };
      }
    });
    document.querySelectorAll(".chip.tag.remove").forEach(function(ch){
      ch.onclick = function(){
        var key = ch.getAttribute("data-key");
        var idx = parseInt(ch.getAttribute("data-idx"),10);
        formTagState(key).splice(idx,1);
        rerenderTagChips(key);
      };
    });

    var btnStartScan = document.getElementById("btnStartScan");
    if(btnStartScan) btnStartScan.onclick = startScan;
    var btnManualConnect = document.getElementById("btnManualConnect");
    if(btnManualConnect) btnManualConnect.onclick = function(){
      var v = document.getElementById("manualLink").value.trim();
      if(v) handleScannedText(v);
    };

    document.querySelectorAll("[data-addnote]").forEach(function(b){
      b.onclick = function(){ state.composingNote = b.getAttribute("data-addnote"); render(); };
    });
    document.querySelectorAll("[data-editnote]").forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-editnote");
        var c = findConnById(id);
        state.noteDraft[id] = c ? c.notes : "";
        state.composingNote = id; render();
      };
    });
    document.querySelectorAll("[data-cancelnote]").forEach(function(b){
      b.onclick = function(){ state.composingNote = null; render(); };
    });
    document.querySelectorAll("[data-savenote]").forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-savenote");
        var ta = document.getElementById("noteInput_"+id);
        var c = findConnById(id);
        if(c && ta){ c.notes = ta.value.trim(); c.noteAddedAt = Date.now(); saveConns(state.connections); }
        state.composingNote = null; render();
      };
    });
    document.querySelectorAll("[data-delete]").forEach(function(b){
      b.onclick = function(){ state.deleteArmed = b.getAttribute("data-delete"); render(); };
    });
    document.querySelectorAll("[data-canceldel]").forEach(function(b){
      b.onclick = function(){ state.deleteArmed = null; render(); };
    });
    document.querySelectorAll("[data-confirmdel]").forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-confirmdel");
        state.connections = state.connections.filter(function(c){ return c.__id !== id; });
        saveConns(state.connections);
        state.deleteArmed = null; render();
      };
    });

    var btnCloseOverlay = document.getElementById("btnCloseOverlay");
    if(btnCloseOverlay) btnCloseOverlay.onclick = function(){ state.justConnected = null; render(); };

    var btnFullOnboard = document.getElementById("btnFullOnboard");
    if(btnFullOnboard) btnFullOnboard.onclick = function(){ state.quickCaptureExpanded = true; render(); };
    var btnCopyLink = document.getElementById("btnCopyLink");
    if(btnCopyLink) btnCopyLink.onclick = function(){
      var link = connectUrl(state.pending);
      function shown(){ var s = document.getElementById("copyStatus"); if(s) s.style.display = "block"; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(link).then(shown).catch(function(){ legacyCopy(link, shown); });
      } else { legacyCopy(link, shown); }
    };
  }

  var __connIdCounter = 0;
  function ensureConnIds(){
    state.connections.forEach(function(c){ if(!c.__id){ c.__id = "c"+(__connIdCounter++)+"_"+Math.random().toString(36).slice(2,6); } });
  }
  function findConnById(id){ return state.connections.filter(function(c){ return c.__id===id; })[0]; }

  var formTags = { profTags:[], persTags:[] };
  function formTagState(key){ return formTags[key]; }
  function addTagToForm(key, v){
    if(formTags[key].length >= 8) return;
    if(formTags[key].indexOf(v) === -1) formTags[key].push(v);
    rerenderTagChips(key);
  }
  function rerenderTagChips(key){
    var wrap = document.getElementById("chips_"+key);
    if(!wrap) return;
    wrap.innerHTML = formTags[key].map(function(t,i){
      return '<span class="chip tag remove" data-key="'+key+'" data-idx="'+i+'">'+escapeHtml(t)+'<span class="x">×</span></span>';
    }).join("");
    wrap.querySelectorAll(".chip.tag.remove").forEach(function(ch){
      ch.onclick = function(){
        var idx = parseInt(ch.getAttribute("data-idx"),10);
        formTags[key].splice(idx,1);
        rerenderTagChips(key);
      };
    });
  }

  function submitProfileForm(){
    var name = document.getElementById("fName").value.trim();
    if(!name) return;
    var goalBtn = document.querySelector("#goalChips .chip.selected");
    var goalOther = document.getElementById("fGoalOther").value.trim();
    var goal = goalOther || (goalBtn ? goalBtn.getAttribute("data-goal") : "");

    var profile = state.editing && state.me ? Object.assign({}, state.me) : { id: uid("u") };
    profile.name = name;
    profile.headline = document.getElementById("fHeadline").value.trim();
    profile.goal = goal;
    profile.profTags = formTags.profTags.slice();
    profile.persTags = formTags.persTags.slice();
    profile.contact = {
      email: document.getElementById("fEmail").value.trim(),
      phone: document.getElementById("fPhone").value.trim(),
      linkedin: document.getElementById("fLinkedin").value.trim(),
      other: document.getElementById("fOther").value.trim()
    };

    state.me = profile;
    saveMe(profile);
    state.editing = false;
    formTags = { profTags:[], persTags:[] };

    if(state.pending){
      var pending = state.pending;
      state.pending = null;
      state.quickCaptureExpanded = false;
      processConnectPayload(encodeProfile(pending));
    } else {
      maybeSeed();
    }
    render();
  }

  /* ---------------- boot ---------------- */
  function boot(){
    var params = new URLSearchParams(location.search);
    var cParam = params.get("c");
    if(cParam){
      history.replaceState(null, "", location.origin + location.pathname);
      var decoded = decodeProfile(cParam);
      if(decoded && (!state.me || decoded.id !== state.me.id)){
        if(state.me){ processConnectPayload(cParam); }
        else { state.pending = decoded; }
      }
    }
    if(state.me) maybeSeed();
    // seed form tag state when opening edit on an existing profile
    if(state.me){ formTags = { profTags:(state.me.profTags||[]).slice(), persTags:(state.me.persTags||[]).slice() }; }
    render();
  }

  // when entering edit mode later, refresh form tag state
  var _origRender = render;
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "btnEdit" && state.me){
      formTags = { profTags:(state.me.profTags||[]).slice(), persTags:(state.me.persTags||[]).slice() };
    }
  }, true);

  boot();
})();
</script>
